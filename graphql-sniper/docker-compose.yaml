services:
  sniper_app:
    container_name: sniper_node
    build:
      context: .
      target: development # <--- Forces compose to use the dev stage
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@172.17.0.1:5432/slardar_db
      - SECRET_SHOP_API_BASE_URL=http://172.17.0.1:8080/api/v1
    stop_grace_period: 0s # Instant restart
    develop:
      watch:
        - action: sync+restart # <--- Change 'sync' to 'sync+restart'
          path: ./apps/api/src # Watch the current folder on your computer
          target: /app/apps/api/src # Sync it to the /app folder in the container
          ignore:
            - dist/
            - node_modules/ # Never sync the heavy node_modules folder
        - action: rebuild
          path: ./apps/api/package.json # Rebuild everything if you add new packages

  nginx:
    container_name: sniper_proxy
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      # Ensure your file is at ./nginx/nginx.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - sniper_app
