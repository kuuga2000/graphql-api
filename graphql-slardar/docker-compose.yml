services:
  slardar_app:
    container_name: slardar_node
    build: .
    environment:
      - NODE_ENV=development
    stop_grace_period: 0s # Instant restart
    develop:
      watch:
        - action: sync+restart # <--- Change 'sync' to 'sync+restart'
          path: ./ # Watch the current folder on your computer
          target: /app # Sync it to the /app folder in the container
          ignore:
            - node_modules/ # Never sync the heavy node_modules folder
        - action: rebuild
          path: package.json # Rebuild everything if you add new packages

  nginx:
    container_name: slardar_proxy
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      # Ensure your file is at ./nginx/nginx.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - slardar_app
