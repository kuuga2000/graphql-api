services:
  slardar_app:
    container_name: slardar_node
    build:
      context: .
      target: development # <--- Forces compose to use the dev stage
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/slardar_db
    stop_grace_period: 0s # Instant restart
    develop:
      watch:
        - action: sync+restart # <--- Change 'sync' to 'sync+restart'
          path: ./ # Watch the current folder on your computer
          target: /app # Sync it to the /app folder in the container
          ignore:
            - node_modules/ # Never sync the heavy node_modules folder
        - action: rebuild
          path: package.json # Rebuild everything if you add new packages
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    container_name: slardar_postgres
    image: postgres:18.2-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: slardar_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    container_name: slardar_pgadmin
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  nginx:
    container_name: slardar_proxy
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      # Ensure your file is at ./nginx/nginx.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - slardar_app

volumes:
  postgres_data:
