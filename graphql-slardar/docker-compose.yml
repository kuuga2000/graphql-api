services:
  slardar_app:
    container_name: slardar_node
    build: .
    environment:
      - NODE_ENV=development

  nginx:
    container_name: slardar_proxy
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      # Ensure your file is at ./nginx/nginx.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - slardar_app
